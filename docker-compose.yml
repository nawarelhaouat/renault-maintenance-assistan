services:
  db:
    image: postgres:16
    container_name: gmao_db
    environment:
      POSTGRES_USER: gmao
      POSTGRES_PASSWORD: gmao
      POSTGRES_DB: gmao
    ports:
      - "5432:5432"
    volumes:
      - gmao_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/auth_history.sql:/docker-entrypoint-initdb.d/02_auth_history.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmao -d gmao"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gmao_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: gmao_ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:7b"]
    restart: "no"

  api:
    build: .
    image: gmao-app
    container_name: gmao_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://gmao:gmao@db:5432/gmao
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:?Définis JWT_SECRET dans le fichier .env}
      WARMUP: "1"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - hf_cache:/root/.cache/huggingface
      - easyocr_cache:/root/.EasyOCR
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy

  web:
    build: ./web
    container_name: gmao_web
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  gmao_data:
  qdrant_data:
  ollama_data:
  hf_cache:
  easyocr_cache: